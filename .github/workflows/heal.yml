name: TVBox 配置自愈

# 定时探测候选源存活，自动重建 config.json 写回本仓库。
# 电视端永远只填本仓库 config.json 的 raw 地址，上游挂了也会自动切到健康源。
# 注意：仓库必须为 Public（私有 raw 电视端匿名拉取会 404）；勿用 fork（scheduled 默认禁用）。

on:
  schedule:
    # 每 4 小时第 17 分（UTC）。冷门分钟避开整点排队拥塞，大幅降低实际延迟。
    # UTC 01:17/05:17/09:17/13:17/17:17/21:17 = 北京 09:17/13:17/17:17/21:17/01:17/05:17
    - cron: '17 */4 * * *'
  workflow_dispatch:  # 允许手动触发测试/外部 watchdog 触发

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行自愈脚本
        run: python heal.py

      - name: 提交健康配置
        run: |
          git config user.name "tvbox-selfheal-bot"
          git config user.email "tvbox-selfheal-bot@users.noreply.github.com"
          git add config.json state.json HEAL_REPORT.md
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自愈更新配置 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push || { echo "PUSH_FAILED"; exit 1; }
          fi

      # jsdelivr 默认缓存 config.json 12 小时(s-maxage=43200)，会导致电视端
      # 在源切换后最长 12 小时仍拉到旧配置。每轮提交后主动清 CDN 缓存。
      - name: 刷新 jsdelivr CDN 缓存
        if: always()
        run: |
          curl -fsS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/config.json" || echo "purge 失败，不影响本轮结果"
          curl -fsS --max-time 30 "https://purge.jsdelivr.net/gh/ByShiNo/tvbox-mirror@main/mirror/m.json" || echo "purge 失败，不影响本轮结果"
